[project]
site_name = "PHIDS"
site_description = "Plant-Herbivore Interaction & Defense Simulator"
site_url = "https://foersben.github.io/PHIDS/"
repo_name = "foersben/PHIDS"
repo_url = "https://github.com/foersben/PHIDS"
docs_dir = "docs"
site_dir = "site"
language = "en"

extra_css = ["https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"]

extra_javascript = [
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js",
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js",
    "https://unpkg.com/mermaid@10/dist/mermaid.min.js",
    "javascripts/katex.js",
    # "javascripts/mermaid.js"
]

[project.theme]
variant = "modern"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "toc.integrate",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
]

[project.theme.palette]
scheme = "slate"
primary = "black"
accent = "deep-orange"


[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions]
admonition = {}
attr_list = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.inlinehilite" = {}
"pymdownx.arithmatex" = { generic = true }
"pymdownx.superfences" = { custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
] }


[[project.nav]]
Home = "index.md"

[[project.nav]]
"Scientific Model" = [
    { "Part I: Foundations" = [
        { "Overview" = "scientific_model/index.md" },
        { "Mathematical Framework" = "scientific_model/part_1_foundations/mathematical_framework.md" },
        { "Related Works" = "scientific_model/part_1_foundations/related_works.md" },
    ] },
    { "Part II: Autotrophic Dynamics" = [
        { "Flora & Symbiosis" = "scientific_model/part_2_autotrophic_dynamics/flora_and_symbiosis.md" },
        { "Morphological Defenses" = "scientific_model/part_2_autotrophic_dynamics/morphological_defenses.md" },
    ] },
    { "Part III: Signaling & Transport" = [
        { "Reaction-Diffusion PDEs" = "scientific_model/part_3_signaling_and_transport/reaction_diffusion.md" },
        { "Chemotaxis & Flow Fields" = "scientific_model/part_3_signaling_and_transport/chemotaxis.md" },
    ] },
    { "Part IV: Heterotrophic Kinematics" = [
        { "Herbivore Behavior & Kinematics" = "scientific_model/part_4_heterotrophic_kinematics/herbivore_behavior.md" },
        { "Population Dynamics" = "scientific_model/part_4_heterotrophic_kinematics/population_dynamics.md" },
    ] },
    { "Part V: Ecosystem Synthesis" = [
        { "Ecological Analytics" = "scientific_model/part_5_ecosystem_synthesis/ecological_analytics.md" },
    ] },
    { "Attested Computations" = [
        { "Overview" = "scientific_model/computations/index.md" },
        { "Defense Signaling Cascade" = "scientific_model/computations/defense_signaling_cascade.md" },
        { "Phloem Translocation" = "scientific_model/computations/phloem_translocation.md" },
        { "Herbivore Starvation" = "scientific_model/computations/herbivore_starvation.md" },
        { "Mycorrhizal Propagation" = "scientific_model/computations/mycorrhizal_propagation.md" },
        { "Clonal Mitosis" = "scientific_model/computations/clonal_mitosis.md" },
    ] },
    { "Future Prospects" = [
        { "Biological Abstractions & Grid Mechanics" = "scientific_model/future_prospects/biological_abstractions.md" },
        { "Parameter Calibration Strategy" = "scientific_model/future_prospects/parameter_calibration_strategy.md" },
        { "Spatiotemporal Scaling Architecture" = "scientific_model/future_prospects/spatiotemporal_scaling.md" },
    ] },
]

[[project.nav]]
"Technical Architecture" = [
    { "Overview" = "technical_architecture/index.md" },
    { "System Architecture" = "technical_architecture/system_architecture.md" },
    { "Engine Execution" = "technical_architecture/engine_execution.md" },
    { "Interfaces & UI" = "technical_architecture/interfaces_and_ui.md" },
    { "Telemetry" = "technical_architecture/telemetry.md" },
    { "Testing Architecture" = "technical_architecture/testing_architecture.md" },
    { "Signaling Trigger Invariants" = "technical_architecture/signaling_triggers.md" },
    { "Future Prospects" = [
        { "GPU CUDA Acceleration Engine" = "technical_architecture/future_prospects/gpu_cuda_acceleration.md" },
    ] },
]

[[project.nav]]
Scenarios = [
    { "Overview" = "scenario_guide/index.md" },
    { "Scenario Authoring" = "scenario_guide/scenario_authoring.md" },
    { "Curated Examples" = "scenario_guide/curated_examples.md" },
    { "Work in Progress" = [
        { "Design Space Exploration (DSE)" = "scenario_guide/work_in_progress/design_space_exploration.md" },
        { "Empirical Database" = "scenario_guide/work_in_progress/empirical_database.md" },
    ] },
    { "Future Prospects" = [
        { "AI Coevolution & Distributed DSE" = "scenario_guide/future_prospects/ai_coevolution_dse.md" },
        { "Agentic Diagnostic Log Writer" = "scenario_guide/future_prospects/agentic_log_writer.md" },
    ] },
]


[[project.nav]]
"Development & Reference" = [
    { "Development Guide" = [
        { "Overview" = "development_guide/index.md" },
        { "Strategic Roadmap" = "development_guide/roadmap.md" },
        { "Contribution & Workflows" = "development_guide/contribution_workflow.md" },
        { "Agent Ecosystem" = "development_guide/agent_ecosystem.md" },
        { "Data-Flow Matrix Architecture" = "development_guide/okf_data_flow_matrices.md" },
    ] },
    { "Reference" = [
        { "Overview" = "reference/index.md" },
        { "Module Map" = "reference/module-map.md" },
        { "Glossary & Concepts" = "reference/glossary-and-concept-index.md" },
        { "Requirements Traceability" = "reference/requirements-traceability.md" },
        { "Python API Reference" = "reference/api.md" },
        { "Epistemic Soundness Audit" = "reports/epistemic_soundness_audit_report.md" },
    ] },
    # { "Legacy Archive" = "legacy/index.md" },
]

[project.plugins.htmlproofer]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = true
heading_level = 2
show_signature_annotations = true

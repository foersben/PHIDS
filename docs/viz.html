      color: #fff;

      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;

    .stats-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-badge {
      flex: 1;
      padding: 8px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      text-align: center;
      font-size: 0.75rem;
      border: 1px solid var(--border-color);
    }
    .stat-badge strong {
      display: block;
      font-size: 1.1rem;
      color: var(--accent-cyan);
    }

    #details-panel {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
    }

    .concept-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-top: 10px;
    }

      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

      gap: 6px;
      margin-bottom: 12px;

    .tag {

      background: rgba(0, 229, 255, 0.15);

    .tag.tier {
      background: rgba(0, 230, 118, 0.15);
      color: var(--accent-green);

      line-height: 1.4;
      color: #d1d5db;
      margin-bottom: 14px;

    document.getElementById('node-count').innerText = graphData.nodes.length;
    document.getElementById('edge-count').innerText = graphData.edges.length;

    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [...graphData.nodes, ...graphData.edges],
      style: [
        {
          selector: 'node',
          style: {
            'label': 'data(label)',
            'color': '#f3f4f6',
            'font-size': '10px',
            'text-valign': 'bottom',
            'text-margin-y': 4,
            'background-color': function(ele) {
              const type = ele.data('type');
              if (type === 'Attested Computation') return '#ff5722';
              if (type === 'Scientific Model') return '#00e5ff';
              if (type === 'Architecture Document') return '#b388ff';
              if (type === 'Agent Role') return '#ffd600';
              if (type === 'Behavioral Rule') return '#ff1744';
              if (type === 'Directory Index') return '#78909c';
              return '#4caf50';
            },
            'border-width': 2,
            'border-color': function(ele) {
              const tier = ele.data('trust_tier');
              if (tier === 'Human-Reviewed') return '#00e676';
              if (tier === 'Machine-Confirmed') return '#00e5ff';
              return 'rgba(255,255,255,0.2)';
            },
            'width': 24,
            'height': 24
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 1.2,
            'line-color': 'rgba(255,255,255,0.18)',
            'target-arrow-color': 'rgba(255,255,255,0.25)',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier',
            'arrow-scale': 0.6
          }
        },
        {
          selector: '.highlighted',
          style: {
            'background-color': '#ffff00',
            'border-width': 4,
            'border-color': '#ffffff'
          }
        }
      ],
      layout: {
        name: 'cose',
        animate: false,
        padding: 50,
        nodeRepulsion: 4500,
        idealEdgeLength: 60
      }
    });

    cy.on('tap', 'node', function(evt) {
      const node = evt.target;
      const data = node.data();

      const panel = document.getElementById('details-panel');
      panel.innerHTML = `
        <div class="concept-card">
          <div class="concept-title">${data.label}</div>
          <div class="tag-list">
            <span class="tag">${data.type}</span>
            <span class="tag tier">${data.trust_tier}</span>
            <span class="tag">${data.status}</span>
          </div>
          <div class="concept-desc">${data.description || '<i>No description declared.</i>'}</div>
          <div class="meta-item"><b>Asset Path:</b> <code>${data.id}</code></div>
        </div>
      `;
    });

    document.getElementById('search').addEventListener('input', function(e) {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        cy.nodes().removeClass('highlighted');
        return;
      }
      cy.nodes().forEach(n => {
        const d = n.data();
        const match = d.label.toLowerCase().includes(q) ||
                      d.type.toLowerCase().includes(q) ||
                      d.id.toLowerCase().includes(q);
        if (match) {
          n.addClass('highlighted');
        } else {
          n.removeClass('highlighted');
        }
      });
    });
  </script>
